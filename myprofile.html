<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile -Yarnify</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="yarnify.png">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Pacifico&display=swap');
        *{
            font-family: "Lilita One", sans-serif;
            margin:0; 
            padding:0; 
            box-sizing:border-box;
        }
        body{
            background: linear-gradient(135deg, #fde2e4,#ffffff);
            height:100vh;
        }
        .profile-container{
            display: flex;
            /* justify-content: center; */
            align-items: flex-start;
            gap: 40px;
            padding-top: 50px;
            padding-left: 150px;
        }
        .left-container{
            width: 320px;
            background: rgba(255, 192, 192,0.5);
            border-radius: 10px;
            padding: 50px 30px 30px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .prev{
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .back-btn{
            width:50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            color: #d6608a;
            font-size: 1.5rem;
            transition: all 0.2s;
        }
        .back-btn:hover{
            background: #ffe8f0;
            transform: scale(1.1);
        }
        .profile-pic{
            position: relative;
            width: 150px;
            height:150px;
            align-items: center;
            margin: auto;
        }
        .profile-pic img{
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
        }
        .upload{
            padding-top: 12px;
            margin-top:10px;
        }
        .upload input{
            display: none;
        }
        .upload label{
            background: rgba(255, 158, 203,0.7);
            color: white;
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 20px;
            font-size: 20px;
        }
        .right-container{
            width: 700px;
            background: #ffffff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display:flex;
            gap:20px;
        }
        form{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:20px;
            margin-top:20px;
        }
        .user-info{
            width: 100%;
        }
        h1{
            color:#d6608a;
        }
        .info{
            width: 100%;
            /* margin-top: 20px; */
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: rgba(219, 213, 255,0.9);
        }
        .info input{
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
        }
        .btns{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top:20px;

        }
        .action-btn{
           display:flex; 
           justify-content:center;
           align-items:center;
           padding:15px 20px;
           border-radius:50px;
           border:none;
           text-decoration: none;
           font-size: 1.1rem;
           cursor:pointer;
           gap:8px;
           color: #ffffff;
           box-shadow:0 4px 15px rgba(0,0,0,0.15);
           transition: all 0.3s;
        }
        .btn-edit{
            color:white;
            background:#ff8fb1;
        }
        .btn-edit:hover{
            transform: translateY(-3px);
        }
        .btn-logout{
            grid-column: span 2;
            background-color: red;
        }
        .btn-logout:hover{
            transform: translateY(-3px);
        }
        .btn-pwd{
            background:rgba(182, 154, 255,0.7);
        }
        .btn-pwd:hover{
            transform: translateY(-3px);;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="left-container">
            <div class="prev">
                <a href="index.php" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
            </div>

            <div class="profile-pic">
                <img src="photos/profile.png" alt="Profile Picture" id="profileImage">
            </div>

            <div class="upload">
                <input type="file" id="imageUpload" accept="image/*">
                <label for="imageUpload">Upload Picture</label>
            </div>
    </div>

        <div class="right-container">
            <div class="user-info">
                <h1>My Profile</h1>

                <form action="" method="POST">
                    <div class="info">
                        <i class="fa-solid fa-user"></i><label>Full Name</label>
                        <input type="text">
                    </div>

                    <div class="info">
                        <i class="fa-solid fa-envelope"></i> <label>Email:</label>
                        <input type="email">
                    </div>

                    <div class="info">
                        <i class="fa-solid fa-phone"></i> <label>Phone Number:</label>
                        <input type="tel" placeholder= "+977" required>
                    </div>

                    <div class="info">
                        <i class="fa-solid fa-location-dot""></i> <label>Address:</label>
                        <input type="text">
                    </div>
                </form>
                <div class="btns">
                    <a href="" class="action-btn btn-edit">
                        <i class="fa-solid fa-pen"></i>
                        Edit Profile
                    </a>
                    <a href="" class="action-btn btn-pwd">
                        <i class="fa-solid fa-key"></i>
                        Change Password
                    </a>
                    <a href="" class="action-btn btn-logout">
                        Logout
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </a>
            </div>
            </div>
            
        </div>
        
    </div>

    <script>
        const imageUpload = document.getElementById("imageUpload");
        const profileImage = document.getElementById("profileImage");
        imageUpload.onchange= function(){
            profileImage.src= URL.createObjectURL(imageUpload.files[0]);
        }
    </script>
</body>
</html>
